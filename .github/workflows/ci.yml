name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlc3QiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTY0NTk5NTIwMCwiZXhwIjoxOTYxNTcxMjAwfQ.fake
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Vérifier les ajouts sensibles
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            REVISION="${{ github.event.pull_request.base.sha }}"
          else
            REVISION="${{ github.event.before }}"
          fi
          node scripts/verifier-avant-commit.mjs --diff "$REVISION" --redact

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run arbre:test-qualite

      - run: npm run arbre:verifier

      - run: npm run build

  e2e-mobile:
    runs-on: ubuntu-latest
    needs: quality
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlc3QiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTY0NTk5NTIwMCwiZXhwIjoxOTYxNTcxMjAwfQ.fake
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npx playwright install chromium --with-deps

      - run: npm run test:e2e
